# ============================================================
# Retail ELT Platform — CI/CD Pipeline
# ============================================================
# Runs on every push and PR to main branch.
# Validates: lint, tests, SQL, dbt compilation
# ============================================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.9"

jobs:
  # ---- Job 1: Python Lint ----
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install flake8 black isort

      - name: Run flake8
        run: |
          flake8 src/ scripts/ dags/ tests/ \
            --max-line-length=120 \
            --ignore=E501,W503,E402,F401 \
            --exclude=__pycache__,dbt_retail

      - name: Check formatting (Black)
        run: |
          black --check --line-length=120 \
            src/ scripts/ tests/ \
            --exclude='dbt_retail|__pycache__'

  # ---- Job 2: Unit Tests ----
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short \
            -k "not test_generate_all_data" \
            --ignore=tests/conftest.py

  # ---- Job 3: SQL Validation ----
  sql-validate:
    name: 📝 SQL Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install sqlfluff
        run: pip install sqlfluff==2.3.5

      - name: Lint SQL files
        run: |
          sqlfluff lint dbt_retail/models/ \
            --dialect postgres \
            --ignore parsing \
            --exclude-rules LT05,AM04 \
            || true  # Non-blocking for now

  # ---- Job 4: dbt Compile ----
  dbt-compile:
    name: ⚙️ dbt Compile
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt
        run: pip install dbt-postgres==1.6.0

      - name: Compile dbt models
        run: |
          cd dbt_retail && dbt compile --profiles-dir . --target dev
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
          POSTGRES_PORT: 5432
        continue-on-error: true  # May fail without DB, but validates SQL parsing
