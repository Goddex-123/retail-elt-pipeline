name: 'dbt_retail'
version: '2.0.0'
config-version: 2

profile: 'retail'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Date range for backfill runs
  start_date: '2023-01-01'
  end_date: '2026-12-31'
  # Quality thresholds
  null_threshold_pct: 5
  min_order_amount: 0

models:
  dbt_retail:
    staging:
      +schema: silver
      +materialized: view
      +tags: ['staging', 'silver']
    intermediate:
      +schema: silver
      +materialized: ephemeral
      +tags: ['intermediate']
    marts:
      sales:
        +schema: gold
        +materialized: table
        +tags: ['mart', 'sales']
      customers:
        +schema: gold
        +materialized: table
        +tags: ['mart', 'customers']
      inventory:
        +schema: gold
        +materialized: table
        +tags: ['mart', 'inventory']
      finance:
        +schema: gold
        +materialized: table
        +tags: ['mart', 'finance']

snapshots:
  dbt_retail:
    +target_schema: gold
    +strategy: timestamp
