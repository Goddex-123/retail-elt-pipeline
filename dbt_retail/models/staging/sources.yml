version: 2

sources:
  - name: bronze
    description: "Raw ingested data from source systems (Bronze Layer)"
    schema: bronze
    loader: "python_bronze_loader"

    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: "_loaded_at"

    tables:
      - name: customers
        description: "Raw customer records from CRM"
        columns:
          - name: customer_id
            description: "Primary key for customers"

      - name: products
        description: "Product catalog from inventory system"
        columns:
          - name: product_id
            description: "Primary key for products"

      - name: categories
        description: "Product category hierarchy"
        columns:
          - name: category_id
            description: "Primary key for categories"

      - name: suppliers
        description: "Supplier/vendor master data"
        columns:
          - name: supplier_id
            description: "Primary key for suppliers"

      - name: stores
        description: "Retail store locations"
        columns:
          - name: store_id
            description: "Primary key for stores"

      - name: orders
        description: "Order headers from POS and e-commerce"
        columns:
          - name: order_id
            description: "Primary key for orders"

      - name: order_items
        description: "Order line items (one row per product per order)"
        columns:
          - name: order_item_id
            description: "Primary key for order items"

      - name: payments
        description: "Payment transactions from payment gateway"
        columns:
          - name: payment_id
            description: "Primary key for payments"

      - name: returns
        description: "Product return/refund records"
        columns:
          - name: return_id
            description: "Primary key for returns"

      - name: shipments
        description: "Shipment tracking from logistics partners"
        columns:
          - name: shipment_id
            description: "Primary key for shipments"

      - name: reviews
        description: "Customer product reviews and ratings"
        columns:
          - name: review_id
            description: "Primary key for reviews"

      - name: inventory
        description: "Current inventory levels per product per store"
        columns:
          - name: inventory_id
            description: "Primary key for inventory"

      - name: promotions
        description: "Active and historical promotional campaigns"
        columns:
          - name: promotion_id
            description: "Primary key for promotions"
